<!doctype html>
<html lang="kk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#162b30" />
    <meta
      name="description"
      content="Бірқалып: жеке қаржыңызға анық жоспар, отбасыңызға ортақ мақсат."
    />
    <title>Бірқалып — бірге де, өзің үшін де</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23307a61'/%3E%3Ctext x='9' y='30' font-size='30' fill='white'%3Eб%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="shell">
      <aside class="sidebar">
        <a class="brand" href="#overview"
          ><span class="brand-mark">б</span>бірқалып<span class="badge ghost"
            >beta</span
          ></a
        >
        <div class="workspace-switch" aria-label="Бюджет кеңістігі">
          <button class="mode active" data-mode="personal">Жеке</button
          ><button class="mode" data-mode="shared">Ортақ <span>→</span></button>
        </div>
        <div class="nav-label" id="nav-label">МЕНІҢ КЕҢІСТІГІМ</div>
        <nav id="nav" aria-label="Негізгі бөлімдер"></nav>
        <div class="sidebar-bottom">
          <div class="upgrade-card">
            <span class="badge mint">BIR QALYP PLUS</span>
            <h3>Жоспарыңды кеңейт.</h3>
            <p>Тереңірек есеп. Көбірек мүмкіндік.</p>
            <button class="btn light wide" data-action="pricing">
              Тарифтерді көру →
            </button>
          </div>
          <button class="profile" data-action="profile">
            <span class="avatar">М</span
            ><span
              ><span class="profile-name" id="profile-name">Мадияр</span
              ><span class="profile-meta" id="profile-meta"
                >Free · жеке кеңістік</span
              ></span
            ><span>⌄</span>
          </button>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="breadcrumb">
            Менің қаржым <span>/</span> <b id="current-label">Шолу</b>
          </div>
          <div class="top-actions">
            <span id="today-label"></span
            ><button
              class="icon-btn"
              data-action="pricing"
              aria-label="Жазылым тарифтері"
            >
              ✧</button
            ><button
              class="user-avatar"
              data-action="profile"
              aria-label="Профиль"
            >
              М
            </button>
          </div>
        </header>
        <div id="app"></div>
        <footer class="app-footer">
          Бірқалып · Ақшаңызға түсінікті жоспар.<span id="storage-label"
            >Жеке деректер осы браузерде сақталады.</span
          >
        </footer>
      </main>
    </div>
    <dialog id="modal" aria-labelledby="modal-title"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <script src="vendor/qrcode.js"></script>
    <script src="app.js"></script>
  </body>
</html>
